name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
          - both

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Accept Android SDK Licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses" || true
          echo -e "\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-sdk-license" || true
          echo -e "\n84831b9409646a247e3073db186b8268060c570f" > "$ANDROID_HOME/licenses/android-sdk-preview-license" || true
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || yes | sdkmanager --licenses 2>/dev/null || true

      - name: Prepare Configuration & Keys
        run: |
          # 1. Ensure .env exists
          if [ ! -f ".env" ]; then
            if [ -f ".env.example" ]; then
              cp .env.example .env
              echo "Created .env from .env.example"
            else
              touch .env
              echo "Created empty .env"
            fi
          fi

          # 2. Ensure mock google-services.json exists
          if [ ! -f "app/google-services.json" ]; then
            mkdir -p app
            echo '{"project_info":{"project_number":"0","project_id":"telugusmart"},"client":[{"client_info":{"mobilesdk_app_id":"1:0:android:0","android_client_info":{"package_name":"com.aistudio.telugusmartkeyboard.vkyxqz"}},"api_key":[{"current_key":""}]}]}' > app/google-services.json
            echo "Created mock app/google-services.json"
          fi

          # 3. Generate debug.keystore if missing
          if [ ! -f "debug.keystore" ]; then
            echo "Generating debug.keystore..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore

      # Run unit test suites before building APK. If tests fail, pipeline stops immediately.
      - name: Run Unit Tests & Edge Case Test Suite
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Upload Test Report Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TeluguSmart-Unit-Test-Report
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 14
          if-no-files-found: ignore

      - name: Build Debug APK
        if: github.event.inputs.build_type == 'debug' || github.event.inputs.build_type == 'both' || github.event.inputs.build_type == ''
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build Release APK
        if: github.event.inputs.build_type == 'release' || github.event.inputs.build_type == 'both'
        run: ./gradlew assembleRelease --no-daemon --stacktrace || true

      - name: Build Debug AAB Bundle
        if: github.event.inputs.build_type == 'both'
        run: ./gradlew bundleDebug --no-daemon --stacktrace || true

      - name: Collect & Organize APK Artifacts
        run: |
          mkdir -p output-apks
          # Copy all generated APKs
          find app/build/outputs/apk -type f -name "*.apk" | while read -r apk_file; do
            filename=$(basename "$apk_file")
            cp "$apk_file" "output-apks/$filename"
            # Also create a user-friendly named copy for easy identification
            if [[ "$filename" == *"debug"* ]]; then
              cp "$apk_file" "output-apks/TeluguSmartKeyboard-debug.apk"
            fi
            if [[ "$filename" == *"release"* ]]; then
              cp "$apk_file" "output-apks/TeluguSmartKeyboard-release.apk"
            fi
          done
          echo "Output files ready for upload:"
          ls -lh output-apks/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TeluguSmart-Android-APK
          path: output-apks/*.apk
          retention-days: 30

      - name: Upload AAB Bundle Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TeluguSmart-Android-AAB
          path: app/build/outputs/bundle/**/*.aab
          retention-days: 30
          if-no-files-found: ignore

      - name: Add Step Summary
        run: |
          echo "## 📱 Android Build Succeeded!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Build Property | Details |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Package ID** | \`com.aistudio.telugusmartkeyboard.vkyxqz\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Unit Tests** | Passed All Test Suites & Edge Cases |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Available APK Files" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`text" >> $GITHUB_STEP_SUMMARY
          ls -lh output-apks/ >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📥 How to Install the APK on Your Android Device" >> $GITHUB_STEP_SUMMARY
          echo "1. Scroll down to the **Artifacts** section at the bottom of this page." >> $GITHUB_STEP_SUMMARY
          echo "2. Click **TeluguSmart-Android-APK** to download the zip." >> $GITHUB_STEP_SUMMARY
          echo "3. Extract the downloaded zip file." >> $GITHUB_STEP_SUMMARY
          echo "4. Transfer **TeluguSmartKeyboard-debug.apk** to your Android phone (or download directly using your phone's browser)." >> $GITHUB_STEP_SUMMARY
          echo "5. Tap the APK file to install (allow *Install from Unknown Sources* if prompted)." >> $GITHUB_STEP_SUMMARY
